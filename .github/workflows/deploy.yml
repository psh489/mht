name: Deploy to Service Public EC2

on:
  push:
    branches:
      - main  # 지시 사항: main 브랜치에 push될 때 작동

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Service VPC Public EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."           # GitHub의 모든 파일
          target: "/var/www/html" # 89번 서버 배포 경로
          strip_components: 0

      - name: Verify Deployment
        run: echo "Deployment to Public EC2 completed successfully!"
